name: linkcheck

# External links rot on other people's schedule, so this runs weekly and
# on demand rather than on PRs -- a merge should never be blocked by
# someone else's outage. A red run here means a link needs fixing, not
# that the tree is broken.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC; odd minute to avoid the on-the-hour crowd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    name: linkcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv run --python 3.13 --group docs sphinx-build -b linkcheck docs docs/_build/linkcheck
