name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  minimum:
    name: minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: bash scripts/check-minimum-dependencies.sh

  distributions:
    name: distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: bash scripts/check-distributions.sh
      - run: uv run --python 3.13 --no-project python scripts/check-versioning.py

  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and ceiling of pyproject's requires-python, plus the
        # versions in between -- nothing verified that claim before.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # --group needs pip >= 25.1 (PEP 735 dependency groups), hence the
      # upgrade first.
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - if: matrix.python-version != '3.13'
        run: python -m pytest tests/
      # Docstring examples are executable documentation: run them on the
      # same matrix as the tests, so a numpy/pandas repr change on any
      # supported version is caught (the numpy 2 scalar repr was exactly
      # such a break).
      - if: matrix.python-version != '3.13'
        run: python -m pytest --doctest-plus --doctest-modules src/calamari
      - name: Tests and doctests with source coverage
        if: matrix.python-version == '3.13'
        run: |
          python -m coverage run -m pytest tests/
          python -m coverage run --append -m pytest --doctest-plus --doctest-modules src/calamari
          python -m coverage report

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      - run: ruff check src tests scripts/check-release-artifacts.py

  docs:
    # The strict build is required on every PR; only main publishes the audited site.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uvx --from cffconvert cffconvert --validate
      - run: uv run --python 3.13 --group dev --group docs python -m pytest tests/test_documentation_references.py
      - run: uv run --python 3.13 --group docs sphinx-build -n -W --keep-going -d "${RUNNER_TEMP}/sphinx-doctrees" -b html docs docs/_build/html

      - run: python scripts/check-doc-site.py docs/_build/html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html
          retention-days: 1

  policy:
    # PK-2 and the research-data policy in AGENTS.md, made enforceable
    # rather than aspirational. Both checks must find nothing.
    name: data policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no absolute home paths
        run: |
          if grep -rIn "/home/\|/Users/" src tests docs; then
            echo "::error::absolute home paths found -- see AGENTS.md, Research data"
            exit 1
          fi
      - name: no instrument data committed
        run: |
          if git ls-files | grep -iE '\.(dat|raw|diag|env|lastscan|nul|drv)$'; then
            echo "::error::instrument data committed -- see AGENTS.md, Research data"
            exit 1
          fi

  pages:
    name: deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [minimum, distributions, test, lint, docs, policy]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v4
